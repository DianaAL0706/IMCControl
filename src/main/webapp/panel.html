
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>IMC Control - Panel principal</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>IMC Control</h1>
        <p>Sistema de monitoreo del índice de masa corporal</p>
    </header>

    <main>
        <section class="contenedor">
            <h2>Mi panel de control</h2>
            <p>Consulta y registra tus mediciones de IMC.</p>

            <h3>Registrar nueva medición</h3>

            <form id="formIMC">
                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso"
                       step="0.01" min="0.01" required>

                <label for="estatura">Estatura (metros):</label>
                <input type="number" id="estatura"
                       step="0.01" min="0.01" required>

                <button type="submit">Guardar medición</button>
            </form>

            <p id="mensajeIMC" aria-live="polite"></p>

            <h3>Mi historial de mediciones</h3>
            <div id="historialIMC">
                <p>Cargando historial de mediciones...</p>
            </div>

            <button type="button" id="btnCerrarSesion">
                Cerrar sesión
            </button>
        </section>
    </main>

    <footer>
        <p>IMC Control - Sistema de seguimiento personal</p>
    </footer>

<script>
    async function verificarSesion() {
        try {
            const respuesta = await fetch("api/usuarios/sesion");

            if (!respuesta.ok) {
                window.location.href = "login.html";
                return;
            }

            console.log("Sesión activa. Acceso autorizado.");
                 const datosSesion = await respuesta.json();
                 await cargarHistorial(datosSesion.idUsuario);
        } catch (error) {
            window.location.href = "login.html";
        }
    }
            async function cargarHistorial(idUsuario) {
    const contenedor = document.getElementById("historialIMC");

    try {
        const respuesta = await fetch(
            "api/imc/historial/" + idUsuario
        );

        if (!respuesta.ok) {
            contenedor.textContent =
                "No se pudo consultar el historial.";
            return;
        }

        const historial = await respuesta.json();

        if (historial.length === 0) {
            contenedor.textContent =
                "Todavía no tienes mediciones registradas.";
            return;
        }

        const lista = document.createElement("ul");

        historial.forEach(registro => {
            const elemento = document.createElement("li");
                const fecha = registro.fechaRegistro
                    .replace("T", " ")
                    .split(".")[0];

                    const partes = fecha.split(" ");
                    const fechaPartes = partes[0].split("-");

                    const fechaFormateada =
                        fechaPartes[2] + "/" +
                        fechaPartes[1] + "/" +
                        fechaPartes[0] + ", " +
                        partes[1];
            elemento.textContent =
                "Fecha: " + fechaFormateada +
                " | Peso: " + registro.peso + " kg" +
                " | Estatura: " + registro.estatura + " m" +
                " | IMC: " + registro.imc;

            lista.appendChild(elemento);
        });

        contenedor.replaceChildren(lista);

    } catch (error) {
        contenedor.textContent =
            "Error de conexión al consultar el historial.";
    }
}   
    verificarSesion();
    
document.getElementById("btnCerrarSesion")
        .addEventListener("click", async function () {

    try {
        const respuesta = await fetch("api/usuarios/logout", {
            method: "POST"
        });

        if (respuesta.ok) {
            window.location.href = "login.html";
        } else {
            alert("No se pudo cerrar la sesión.");
        }

    } catch (error) {
        alert("Error de conexión al cerrar sesión.");
    }
});

document.getElementById("formIMC")
        .addEventListener("submit", async function (evento) {

    evento.preventDefault();

    const mensaje = document.getElementById("mensajeIMC");

    const peso = parseFloat(
        document.getElementById("peso").value
    );

    const estatura = parseFloat(
        document.getElementById("estatura").value
    );

    mensaje.textContent = "Guardando medición...";

try {
    const respuesta = await fetch("api/imc/guardar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            peso: peso,
            estatura: estatura
        })
    });

    const resultado = await respuesta.json();

    if (respuesta.ok) {
    const imc = peso / (estatura * estatura);

    mensaje.textContent =
        resultado.mensaje +
        " | Tu IMC es: " + imc.toFixed(2);

    mensaje.style.color = "green";
    const respuestaSesion = await fetch("api/usuarios/sesion");

        if (respuestaSesion.ok) {
            const datosSesion = await respuestaSesion.json();
            await cargarHistorial(datosSesion.idUsuario);
        }
} 
    else {
        mensaje.textContent =
            resultado.error || "No se pudo guardar la medición.";
        mensaje.style.color = "red";
    }

} catch (error) {
    mensaje.textContent =
        "Error de conexión. Intenta nuevamente.";
    mensaje.style.color = "red";
}

});

</script>

</body>
</html>
