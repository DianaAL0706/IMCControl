
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>IMC Control - Registro</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <h1>IMC Control</h1>
        <p>Registro de nuevos usuarios</p>
    </header>

    <main>
        <section>
            <h2>Crear una cuenta</h2>
            <p>Completa tus datos para comenzar.</p>

            <form id="formRegistro">

                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre"
                       name="nombre" required>

                <label for="edad">Edad:</label>
                <input type="number" id="edad"
                       name="edad" min="2" required>

                <label for="sexo">Sexo:</label>
                <select id="sexo" name="sexo" required>
                    <option value="">Selecciona una opción</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Otro">Otro</option>
                </select>

                <label for="estatura">Estatura (metros):</label>
                <input type="number" id="estatura"
                       name="estatura" min="1"
                       max="2.5" step="0.01" required>

                <label for="usuario">Nombre de usuario:</label>
                <input type="text" id="usuario"
                       name="usuario" required>

                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena"
                       name="contrasena" required>

                <button type="submit">Registrarse</button>
                </form>
            
                <p id="mensajeRegistro" aria-live="polite"></p>
                
                <p>
                    
                ¿Ya tienes una cuenta?
                <a href="index.html">Volver al inicio</a>
            </p>
        </section>
    </main>

    <footer>
        <p>IMC Control - Sistema de seguimiento personal</p>
    </footer>
    
    <script>
    const formulario = document.getElementById("formRegistro");
    const mensaje = document.getElementById("mensajeRegistro");

    formulario.addEventListener("submit", async function(evento) {
        evento.preventDefault();
        
    const datosUsuario = {
    nombre: document.getElementById("nombre").value.trim(),
    edad: Number(document.getElementById("edad").value),
    sexo: document.getElementById("sexo").value,
    estatura: Number(document.getElementById("estatura").value),
    usuario: document.getElementById("usuario").value.trim(),
    contrasena: document.getElementById("contrasena").value
    };
        mensaje.textContent = "Procesando registro...";
    
    try {
    const respuesta = await fetch("api/usuarios/registro", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(datosUsuario)
    });

    const resultado = await respuesta.json();

    mensaje.textContent = resultado.mensaje;

    if (respuesta.ok) {
        mensaje.style.color = "green";
        formulario.reset();
    } else {
        mensaje.style.color = "red";
    }

} catch (error) {
    mensaje.textContent =
            "Error de conexión. Intenta nuevamente.";
    mensaje.style.color = "red";
}

    });
    </script>
    
</body>
</html>
